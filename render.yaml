databases:
  - name: solunet-db
    plan: free
    databaseName: solunet
    user: solunet

services:
  - type: web
    name: solunet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: solunet-db
          property: connectionString
