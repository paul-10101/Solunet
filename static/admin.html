<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>대시보드 · Solunet</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .cmpk { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
  .cmpk div { border:1px solid var(--grid); border-radius:6px; padding:12px; } .cmpk span { font-size:12px; color:var(--muted); display:block; }
  .cmpk b { font-size:18px; font-variant-numeric:tabular-nums; } .cmpk i { font-style:normal; font-size:12px; font-weight:600; margin-left:6px; }
  .up { color:#15803D; } .down { color:#B3261E; } .flat { color:var(--muted); }
  .draft { display:inline-block; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:#FEF3C7; color:#92400E; margin-bottom:8px; }
  @media (max-width:820px) { .cmpk { grid-template-columns:1fr 1fr; } }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .gridbg { background-color:#fff; background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:12px 12px; border:1px solid var(--grid); }
  svg { width:100%; height:auto; display:block; }
  pre { white-space:pre-wrap; font-family:inherit; font-size:14px; line-height:1.8; }
  .chg { border-left:3px solid var(--route); padding:6px 12px; margin-bottom:8px; font-size:14px; } .chg small { color:var(--muted); display:block; }
  .cpb { display:grid; grid-template-columns:150px 1fr 60px; gap:10px; align-items:center; font-size:14px; margin-bottom:8px; }
  .cpb .track { height:14px; background:var(--grid); border-radius:3px; overflow:hidden; } .cpb .track i { display:block; height:100%; background:var(--sign); }
  tr.hot { background:#FFF8E1; }
  .crowd { display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:8px; background:#FEF2F2; border:1.5px solid #FCA5A5; color:#7F1D1D; margin-bottom:12px; font-size:14px; }
  .crowd b { font-size:15px; } .crowd i { width:28px; height:28px; flex:none; border-radius:50%; background:#B3261E; color:#fff; display:grid; place-items:center; font-style:normal; font-weight:700; }
  .pform { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:12px; } .pform label { margin:0; }
  @media (max-width:820px) { .pform { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="topbar"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a class="logo" href="/"><i></i>Solunet</a><span class="muted" id="evName"></span><span id="demoBadge"></span></div>
  <nav class="nav" data-nav></nav></header>
<main class="page">
  <div id="gate"></div>
  <div id="body" hidden>
    <div class="head"><div id="seedBox"></div></div>
    <div id="crowdBox"></div>
    <div class="kpis" style="margin-bottom:12px" id="kpis"></div>
    <p class="note" style="margin:-4px 0 12px" id="opsNote"></p>
    <div class="grid2" style="margin-bottom:12px">
      <section class="card"><div class="head" style="margin-bottom:10px"><h2>거점별 이탈</h2><span class="note" style="margin:0" id="mapNote"></span></div><div id="map"></div></section>
      <section class="card"><h2 style="margin-bottom:10px">거점별 현황</h2><div id="table"></div></section>
    </div>
    <p class="note" style="margin:-4px 0 12px">병목 판단은 후보 배치 비교용입니다. 사고·안전 예측이 아닙니다.</p>
    <section class="card" style="margin-bottom:12px"><div class="head" style="margin-bottom:10px"><h2>회차 비교</h2><span class="note" style="margin:0" id="cmpNote"></span></div><div id="cmp"></div></section>
    <div class="grid2" style="grid-template-columns:1fr 1fr">
      <section class="card"><div class="head" style="margin-bottom:10px"><h2>성과 평가보고서 초안</h2><button class="btn" id="btnReport">보고서 생성</button></div><div id="report"></div></section>
      <section class="card"><div class="head" style="margin-bottom:10px"><h2>다음 회차 배치·인력 제안</h2><button class="btn line" id="btnDesign">제안 생성</button></div><div id="design"></div></section>
    </div>
    <section class="card" style="margin-top:12px"><div class="head" style="margin-bottom:10px"><div><h2>다음 행사 제안서 초안</h2><p class="note" style="margin:2px 0 0">이번 회차 기록을 근거로 과업 이해·운영 계획·성과 목표·결과 보고 계획을 씁니다. 금액은 넣지 않습니다.</p></div></div>
      <form class="pform" id="propForm"><label>제안할 행사 이름<input id="pTitle" maxlength="80"></label><label>예상 참가 (명)<input id="pVis" type="number" min="1"></label><label>기간 (일)<input id="pDays" type="number" min="1" max="60"></label><button class="btn line" type="submit">초안 생성</button></form>
      <div id="proposal"></div></section>
  </div>
</main>
<script src="/admin.js"></script>
<script>Admin.nav("dash");</script>
<script>
const fid = new URLSearchParams(location.search).get('f') || 'demo';
const isDemo = fid === 'demo', E = Admin.esc, $ = id => document.getElementById(id);
const call = (url, opts = {}) => isDemo ? fetch(url, opts).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))) : Admin.api(url, opts);

async function load() {
  let d;
  try { d = await call('/api/stats/' + encodeURIComponent(fid)); }
  catch (e) { $('kpis').innerHTML = `<div class="card" style="grid-column:1/-1">${isDemo ? '예시 데이터가 아직 없습니다. "예시 데이터 불러오기"를 눌러 주세요.' : '데이터를 불러오지 못했습니다.'}</div>`; return; }
  const c = d.current, p = d.previous, f = d.festival;
  $('evName').textContent = f.name;
  $('demoBadge').innerHTML = f.demo ? '<span class="badge demo">예시 데이터</span>' : '';
  const worst = c.checkpoints.filter(x => x.dropped_after > 0).sort((a, b) => b.drop_rate - a.drop_rate)[0];
  const topReason = Object.keys(c.exit_reasons)[0];
  $('kpis').innerHTML = [
    ['참여자', c.visitors + '명', p ? `이전 회차 ${p.visitors}명` : `${f.edition}회차`],
    ['완주율', c.completion_rate + '%', p ? `이전 회차 ${p.completion_rate}%` : `완주 ${c.completed}명`],
    ['병목 거점', worst ? worst.name : '-', worst ? `이후 이탈 ${worst.drop_rate}%` : '데이터 부족', 'warn'],
    [topReason ? '이탈 사유 1위' : '설문 응답', topReason ? topReason : (c.survey.count + '건'), topReason ? `응답 ${c.exit_reasons[topReason]}건` : (c.survey.count ? `혼잡도 평균 ${c.survey.crowd_avg} / 5` : '')],
  ].map(([k, v, s, cls]) => `<div class="card kpi ${cls || ''}"><span>${k}</span><b>${E(v)}</b><small>${E(s)}</small></div>`).join('');

  // 좌표가 있는 예시 행사는 배치도, 실제 행사는 막대 그래프
  if (f.demo) {
    const pos = { gate: [10, 80], market: [30, 55], stage: [55, 70], craft: [75, 35], view: [90, 12] };
    const X = x => 40 + x * 5.2, Y = y => 20 + y * 2.6, mx = Math.max(...c.checkpoints.map(x => x.visitors), 1);
    let s = `<div class="gridbg"><svg viewBox="0 0 600 300"><polyline fill="none" stroke="#2563EB" stroke-width="4" points="${c.checkpoints.map(x => X(pos[x.id][0]) + ',' + Y(pos[x.id][1])).join(' ')}"/>`;
    c.checkpoints.forEach(x => { const [px, py] = pos[x.id], r = 10 + 18 * x.visitors / mx;
      s += `<circle cx="${X(px)}" cy="${Y(py)}" r="${r}" fill="#F59E0B" opacity="${Math.min(0.1 + x.drop_rate / 30, 0.9)}"/><rect x="${X(px) - 8}" y="${Y(py) - 8}" width="16" height="16" fill="#0F172A"/>
            <text x="${X(px)}" y="${Y(py) + r + 14}" text-anchor="middle" font-size="12" fill="#0F172A">${E(x.name)} ${x.dropped_after ? x.drop_rate + '%' : ''}</text>`; });
    $('map').innerHTML = s + '</svg></div>'; $('mapNote').textContent = '원 크기 = 방문자, 주황 진하기 = 이후 이탈률';
  } else {
    $('map').innerHTML = c.checkpoints.map((x, i) => `<div class="cpb"><span>${i + 1}. ${E(x.name)}</span><span class="track"><i style="width:${Math.min(x.drop_rate, 100)}%"></i></span><b>${x.dropped_after ? x.drop_rate + '%' : '-'}</b></div>`).join('');
    $('mapNote').textContent = '막대 = 그 거점 다음으로 가지 않은 비율';
  }
  const prevCp = p ? Object.fromEntries(p.checkpoints.map(x => [x.id, x])) : {};
  $('table').innerHTML = `<table><tr><th>거점</th><th>방문</th><th>이탈률</th>${p ? '<th>이전 회차</th>' : ''}</tr>` +
    c.checkpoints.map(x => `<tr class="${worst && x.id === worst.id ? 'hot' : ''}"><td>${E(x.name)}</td><td>${x.visitors}</td><td>${x.dropped_after ? x.drop_rate + '%' : '-'}</td>${p ? `<td>${prevCp[x.id] && prevCp[x.id].dropped_after ? prevCp[x.id].drop_rate + '%' : '-'}</td>` : ''}</tr>`).join('') + '</table>' +
    (Object.keys(c.exit_reasons).length ? `<p class="note">이탈 사유: ${Object.entries(c.exit_reasons).map(([k, v]) => `${E(k)} ${v}`).join(' · ')}</p>` : '') +
    (c.survey.count ? `<p class="note">설문 ${c.survey.count}건 · 혼잡도 ${c.survey.crowd_avg} / 5 · 동선 편의 ${c.survey.route_avg} / 5${c.survey.satisfaction_avg ? ` · 만족도 ${c.survey.satisfaction_avg} / 5` : ''}${Object.keys(c.survey.revisit || {}).length ? ` · 재방문 의사 ${Object.entries(c.survey.revisit).map(([k, v]) => `${E(k)} ${v}`).join(', ')}` : ''}</p>` : '');
  const cr = d.crowd, pz = d.prizes;
  $('crowdBox').innerHTML = cr.alerts.length ? `<div class="crowd" role="alert"><i>!</i><div><b>혼잡 경고 · ${cr.alerts.map(a => E(a.name)).join(', ')}</b><br>최근 ${cr.window_min}분 동안 ${cr.alerts.map(a => a.recent + '명').join(', ')}이 찍었습니다 (기준 ${cr.threshold}명).</div></div>` : '';
  $('opsNote').innerHTML = `혼잡 경고 기준: 최근 ${cr.window_min}분 ${cr.threshold}명 이상` + (pz.name ? ` · 경품(${E(pz.name)}) 교환권 발급 ${pz.issued}건, 지급 완료 ${pz.redeemed}건` : ' · 경품 미운영') + (isDemo ? '' : ` · <a href="/admin/settings?f=${encodeURIComponent(fid)}">설정 바꾸기</a>`);
  if (!$('pTitle').value) $('pTitle').value = f.name.replace(/\s*\(.*\)$/, '') + ' 다음 회차';
  renderCompare(d);
}
function renderCompare(d) {
  const m = d.comparison, f = d.festival;
  if (!m) {
    $('cmpNote').textContent = `현재 ${f.edition}회차`;
    $('cmp').innerHTML = `<p class="muted" style="font-size:14px">아직 비교할 이전 회차가 없습니다. 행사가 끝난 뒤 <a href="${Admin.isOwner() ? '/my?f=' + encodeURIComponent(fid) : '/admin/events'}">${Admin.isOwner() ? '내 행사' : '행사 관리'}</a>에서 '다음 회차 시작'을 누르면, 같은 QR로 ${f.edition + 1}회차 데이터가 쌓이고 여기서 ${f.edition}회차와 나란히 비교됩니다.</p>`;
    return;
  }
  $('cmpNote').textContent = `${f.edition - 1}회차 → ${f.edition}회차 · 같은 거점 기준`;
  const delta = (a, b, unit, better) => {
    if (a == null || b == null) return '';
    const dv = Math.round((b - a) * 10) / 10, cls = dv === 0 ? 'flat' : ((dv > 0) === better ? 'up' : 'down');
    return `<i class="${cls}">${dv > 0 ? '+' : ''}${dv}${unit}</i>`;
  };
  const cell = (k, a, b, unit, better) => `<div><span>${k}</span><b>${a ?? '-'} → ${b ?? '-'}</b>${delta(a, b, unit, better)}</div>`;
  let h = '<div class="cmpk">' +
    cell('참여자 (명)', m.visitors_prev, m.visitors_cur, '', true) +
    cell('완주율 (%)', m.completion_prev, m.completion_cur, '%p', true) +
    cell('만족도 (/5)', m.satisfaction_prev, m.satisfaction_cur, '', true) +
    cell('재방문 의사 (%)', m.revisit_prev, m.revisit_cur, '%p', true) +
    cell('혼잡도 (/5, 낮을수록 좋음)', m.crowd_prev, m.crowd_cur, '', false) + '</div>';
  h += '<table><tr><th>거점</th><th>이전 회차 이탈률</th><th>이번 회차 이탈률</th><th>변화</th></tr>' +
    m.checkpoints.filter(x => x.drop_rate_prev || x.drop_rate_cur).map(x => `<tr><td>${E(x.name)}</td><td>${x.drop_rate_prev}%</td><td>${x.drop_rate_cur}%</td><td>${delta(x.drop_rate_prev, x.drop_rate_cur, '%p', false)}</td></tr>`).join('') + '</table>';
  $('cmp').innerHTML = h;
}
const srcLabel = s => s === 'llm' ? 'AI 작성 · 숫자는 코드 계산값과 대조 완료' : '숫자 기반 템플릿 작성 (AI 미연결 또는 숫자 대조 실패)';
const DRAFT = '<span class="draft">담당자 검수 전 초안</span>';
$('btnReport').onclick = async () => { $('report').textContent = '작성 중';
  try { const d = await call('/api/report/' + encodeURIComponent(fid), { method: 'POST' }); $('report').innerHTML = `${DRAFT}<pre>${E(d.text)}</pre><p class="note">${srcLabel(d.source)}</p>`; }
  catch (e) { $('report').textContent = '생성하지 못했습니다. 잠시 후 다시 눌러 주세요.'; } };
$('btnDesign').onclick = async () => { $('design').textContent = '작성 중';
  try { const d = await call('/api/design/' + encodeURIComponent(fid), { method: 'POST' });
        $('design').innerHTML = DRAFT + d.plan.changes.map(c => `<div class="chg"><b>${E(c.checkpoint)}</b> ${E(c.action)}<small>근거: ${E(c.evidence)}</small></div>`).join('') + `<pre style="margin-top:8px">${E(d.explanation.text)}</pre><p class="note">${srcLabel(d.explanation.source)}</p>`; }
  catch (e) { $('design').textContent = '생성하지 못했습니다. 잠시 후 다시 눌러 주세요.'; } };

$('propForm').onsubmit = async e => { e.preventDefault(); $('proposal').textContent = '작성 중';
  try { const d = await call('/api/proposal/' + encodeURIComponent(fid), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: $('pTitle').value, expected_visitors: +$('pVis').value || null, days: +$('pDays').value || null }) });
        $('proposal').innerHTML = `${DRAFT}<pre>${E(d.text)}</pre><p class="note">${srcLabel(d.source)} · 목표 규칙: ${E(d.basis.target_rule)}</p>`; }
  catch (e) { $('proposal').textContent = e.message && isNaN(e.message) ? e.message : '생성하지 못했습니다. 잠시 후 다시 눌러 주세요.'; } };
setInterval(() => { if (!document.hidden) load(); }, 15000);  // 혼잡 경고가 제때 뜨도록 주기적으로 갱신

(isDemo ? Promise.resolve() : Admin.ready($('gate'))).then(() => {
  $('body').hidden = false;
  if (isDemo) { $('seedBox').innerHTML = '<button class="btn line" id="seed">예시 데이터 불러오기</button>';
    $('seed').onclick = async () => { $('seed').disabled = true; await fetch('/api/demo/seed', { method: 'POST' }); $('seed').disabled = false; load(); }; }
  load();
});
</script>
</body>
</html>
