<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solunet — 축제 회차 개선 플랫폼</title>
<meta name="description" content="작년 데이터로 올해 축제를 다시 설계하고, 성과를 숫자로 보고합니다.">
<style>
  :root { --ink:#1a1f2b; --sub:#5b6474; --accent:#1f8f5f; --bg:#f7f8fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:72px 24px; }
  .tag { display:inline-block; font-size:13px; color:var(--accent); border:1px solid var(--accent);
         border-radius:999px; padding:4px 12px; margin-bottom:24px; }
  h1 { font-size:40px; letter-spacing:-0.02em; margin-bottom:12px; }
  .lead { font-size:20px; color:var(--sub); margin-bottom:48px; }
  .loop { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:48px; }
  .step { background:#fff; border:1px solid #e3e6eb; border-radius:12px; padding:16px; }
  .step b { display:block; font-size:15px; margin-bottom:4px; }
  .step span { font-size:13px; color:var(--sub); }
  .quote { font-size:17px; border-left:3px solid var(--accent); padding-left:16px; margin-bottom:48px; }
  footer { font-size:13px; color:var(--sub); }
  @media (max-width:600px) { h1 { font-size:30px; } .loop { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<main>
  <span class="tag">준비 중 · 2026 G-Star 창업경진대회 본선</span>
  <h1>Solunet</h1>
  <p class="lead">작년 데이터로 올해 축제를 다시 설계하고,<br>성과를 숫자로 보고합니다.</p>

  <div class="loop">
    <div class="step"><b>행사 전</b><span>동선·부스 설계</span></div>
    <div class="step"><b>행사 중</b><span>무설치 QR 데이터 수집</span></div>
    <div class="step"><b>행사 후</b><span>평가보고서</span></div>
    <div class="step"><b>다음 회차</b><span>개선안</span></div>
  </div>

  <p class="quote">우리는 사람을 대체하지 않습니다.<br>같은 인원이 더 많은 일을, 기록을 남기며 하게 만듭니다.</p>

  <footer>© 2026 Solunet · 국립경국대학교</footer>
</main>
</body>
</html>
